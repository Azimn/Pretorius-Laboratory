name: Pretorius protected subject-frame local model gate
on:
  pull_request:
    paths:
      - "pretorius_lab/doctor_subject_frame_proposer.py"
      - "pretorius_lab/doctor_holdout_protocol.py"
      - "tests/test_doctor_subject_frame_proposer.py"
      - "tools/run_doctor_subject_frame_pilot.py"
      - "tools/diagnose_doctor_model_position.py"
      - ".github/workflows/doctor-subject-frame-local.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-frozen-local-model:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout research laboratory
        uses: actions/checkout@v4
        with:
          path: laboratory
      - name: Checkout frozen production Doctor brain
        uses: actions/checkout@v4
        with:
          repository: Azimn/The-Doctor-Lives
          ref: 56aab5493ef48cdb560881a138b2277ca6ebcce0
          persist-credentials: false
          path: doctor-cognition
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify experimental source revision
        run: |
          test "$(git -C doctor-cognition rev-parse HEAD)" = "56aab5493ef48cdb560881a138b2277ca6ebcce0"
          git -C laboratory rev-parse HEAD > source-lab-sha.txt
          git -C doctor-cognition rev-parse HEAD > source-doctor-sha.txt
      - name: Install frozen CPU model dependencies and both projects
        run: |
          python -m pip install -e ./doctor-cognition -e ./laboratory
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.5.1+cpu"
          python -m pip install "transformers==4.46.3" "huggingface-hub==0.26.5" "tokenizers==0.20.3"
      - name: Test strictly bounded first-person policy input and output
        working-directory: laboratory
        run: |
          python -m unittest discover -s tests -p "test_doctor_subject_frame_proposer.py" -v
      - name: Execute real pinned 135M CPU model over 24 controller-task arms
        working-directory: laboratory
        run: |
          python tools/run_doctor_subject_frame_pilot.py --output "$RUNNER_TEMP/protected-lab-actions"
          cp "$RUNNER_TEMP/protected-lab-actions/score.json" ../subject-frame-score.json
          cat ../subject-frame-score.json
      - name: Diagnose letter-position bias without physical action or score credit
        working-directory: laboratory
        run: |
          python tools/diagnose_doctor_model_position.py --output "$RUNNER_TEMP/protected-lab-actions"
          cp "$RUNNER_TEMP/protected-lab-actions/option-order-diagnostic.json" ../model-position-diagnostic.json
      - name: Preserve exact-source graded actions and nulls
        uses: actions/upload-artifact@v4
        with:
          name: pretorius-protected-subject-frame-local-decoder
          path: |
            subject-frame-score.json
            model-position-diagnostic.json
            source-lab-sha.txt
            source-doctor-sha.txt
          if-no-files-found: error
          retention-days: 60
