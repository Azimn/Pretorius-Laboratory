name: Esoteric full-text shelf annex acceptance
on:
  pull_request:
    paths:
      - "corpus/esoteric_annex_1890.json"
      - "pretorius_lab/shelf_annex.py"
      - "pretorius_lab/habitat_v2.py"
      - "pretorius_lab/book_library.py"
      - "pretorius_lab/period_bookshelf.py"
      - "tests/test_shelf_annex.py"
      - ".github/workflows/esoteric-annex.yml"
  workflow_dispatch:
jobs:
  esoteric-collection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify original book and new spatial-annex invariants
        run: python -m unittest discover -s tests -v
      - name: Assemble 7 original and 10 esoteric complete texts
        run: |
          mkdir -p "$RUNNER_TEMP/esoteric-library"
          python -m pretorius_lab.habitat_v2 --db "$RUNNER_TEMP/esoteric-library/laboratory.sqlite3" init
          python -m pretorius_lab.period_bookshelf --db "$RUNNER_TEMP/esoteric-library/laboratory.sqlite3" --catalog corpus/victorian_bookshelf_v1.json --year 1890 > "$RUNNER_TEMP/esoteric-library/original-ingest.json"
          python -m pretorius_lab.period_bookshelf --db "$RUNNER_TEMP/esoteric-library/laboratory.sqlite3" --catalog corpus/esoteric_annex_1890.json --year 1890 --register-annex > "$RUNNER_TEMP/esoteric-library/esoteric-ingest.json"
          python -m pretorius_lab.book_cli --db "$RUNNER_TEMP/esoteric-library/laboratory.sqlite3" verify > "$RUNNER_TEMP/esoteric-library/book-ledger-proof.json"
          python -m pretorius_lab.book_cli --db "$RUNNER_TEMP/esoteric-library/laboratory.sqlite3" catalog > "$RUNNER_TEMP/esoteric-library/catalog.json"
          python -m pretorius_lab.habitat_v2 --db "$RUNNER_TEMP/esoteric-library/laboratory.sqlite3" scan shelf:1 > "$RUNNER_TEMP/esoteric-library/shelf1-observation.json"
          python -m pretorius_lab.habitat_v2 --db "$RUNNER_TEMP/esoteric-library/laboratory.sqlite3" scan shelf:3 > "$RUNNER_TEMP/esoteric-library/shelf3-observation.json"
          python -m pretorius_lab.habitat_v2 --db "$RUNNER_TEMP/esoteric-library/laboratory.sqlite3" backup "$RUNNER_TEMP/esoteric-library/complete-17-volume-backup.sqlite3" > "$RUNNER_TEMP/esoteric-library/physical-proof.json"
          python -m pretorius_lab.book_cli --db "$RUNNER_TEMP/esoteric-library/complete-17-volume-backup.sqlite3" verify
      - name: Confirm all 17 installed books and separate shelf occupancy
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "esoteric-library"
          books = json.loads((root / "catalog.json").read_text())
          occult = json.loads((root / "esoteric-ingest.json").read_text())
          initial = json.loads((root / "original-ingest.json").read_text())
          one = json.loads((root / "shelf1-observation.json").read_text())
          three = json.loads((root / "shelf3-observation.json").read_text())
          assert len(books) == 17, len(books)
          assert initial["installed"] == 7 and occult["installed"] == 10
          assert sum(a["digital_segments"] for a in occult["books"]) > 1000
          assert all(b["page_count"] > 10 for b in books.values())
          assert [p["occupant"]["id"] for p in one["positions"]] == [
              f"book:{i:03d}" for i in range(8, 18)]
          assert [p["occupant"]["id"] for p in three["positions"][:7]] == [
              f"book:{i:03d}" for i in range(1, 8)]
          print("17 source-backed books; no duplicate anchors; original seven retained")
          PY
      - name: Demonstrate real occult-text reading requires actor to approach shelf
        run: |
          python -m pretorius_lab.embodied_cli --db "$RUNNER_TEMP/esoteric-library/laboratory.sqlite3" init
          python -m pretorius_lab.embodied_cli --db "$RUNNER_TEMP/esoteric-library/laboratory.sqlite3" look > "$RUNNER_TEMP/esoteric-library/threshold-view.json"
          if python -m pretorius_lab.embodied_cli --db "$RUNNER_TEMP/esoteric-library/laboratory.sqlite3" book read book:008; then
            echo "ERROR: esoteric source readable remotely from doorway"; exit 1
          fi
          python -m pretorius_lab.embodied_cli --db "$RUNNER_TEMP/esoteric-library/laboratory.sqlite3" go station:center
          python -m pretorius_lab.embodied_cli --db "$RUNNER_TEMP/esoteric-library/laboratory.sqlite3" go station:shelf:1
          python -m pretorius_lab.embodied_cli --db "$RUNNER_TEMP/esoteric-library/laboratory.sqlite3" look > "$RUNNER_TEMP/esoteric-library/shelf1-embodied-view.json"
          python -m pretorius_lab.embodied_cli --db "$RUNNER_TEMP/esoteric-library/laboratory.sqlite3" book open book:008
          python -m pretorius_lab.embodied_cli --db "$RUNNER_TEMP/esoteric-library/laboratory.sqlite3" book read book:008 > "$RUNNER_TEMP/esoteric-library/authorized-fulltext-read.json"
          python -m pretorius_lab.embodied_cli --db "$RUNNER_TEMP/esoteric-library/laboratory.sqlite3" book mark book:008 --bookmark research-slip
          python -m pretorius_lab.embodied_cli --db "$RUNNER_TEMP/esoteric-library/laboratory.sqlite3" book close book:008
          python -m pretorius_lab.embodied_cli --db "$RUNNER_TEMP/esoteric-library/laboratory.sqlite3" verify > "$RUNNER_TEMP/esoteric-library/body-proof.json"
          python -m pretorius_lab.habitat_v2 --db "$RUNNER_TEMP/esoteric-library/laboratory.sqlite3" backup "$RUNNER_TEMP/esoteric-library/embodied-17-volume-backup.sqlite3"
          python -m pretorius_lab.embodied_cli --db "$RUNNER_TEMP/esoteric-library/embodied-17-volume-backup.sqlite3" verify

      - name: Carry actual Isis Unveiled to the workbench and verify source-backed placement
        run: |
          db="$RUNNER_TEMP/esoteric-library/laboratory.sqlite3"
          python -m pretorius_lab.embodied_cli --db "$db" init-custody
          python -m pretorius_lab.habitat_v2 --db "$db" act place beaker:001 floor:corner:se
          python -m pretorius_lab.embodied_cli --db "$db" take book:008
          python -m pretorius_lab.habitat_v2 --db "$db" scan shelf:1 > "$RUNNER_TEMP/esoteric-library/after-pickup-shelf1.json"
          python -m pretorius_lab.embodied_cli --db "$db" go station:center
          python -m pretorius_lab.embodied_cli --db "$db" go station:bench
          python -m pretorius_lab.embodied_cli --db "$db" put book:008 bench:main/position:left
          python -m pretorius_lab.habitat_v2 --db "$db" scan bench:main > "$RUNNER_TEMP/esoteric-library/after-drop-workbench.json"
          python -m pretorius_lab.embodied_cli --db "$db" book open_mark book:008 --bookmark research-slip
          python -m pretorius_lab.embodied_cli --db "$db" book read book:008 > "$RUNNER_TEMP/esoteric-library/workbench-source-read.json"
          # Place the original beaker into the source book's now genuinely free
          # shelf position despite the immutable v2/annex historic reservation.
          python -m pretorius_lab.habitat_v2 --db "$db" act place beaker:001 shelf:1/slot:1 > "$RUNNER_TEMP/esoteric-library/reused-slot-operator-receipt.json"
          python -m pretorius_lab.habitat_v2 --db "$db" scan shelf:1 > "$RUNNER_TEMP/esoteric-library/reused-shelf1-with-beaker.json"
          python -m pretorius_lab.embodied_cli --db "$db" verify-custody > "$RUNNER_TEMP/esoteric-library/custody-proof.json"
          python -m pretorius_lab.habitat_v2 --db "$db" backup "$RUNNER_TEMP/esoteric-library/handled-17-volume-backup.sqlite3"
          python -m pretorius_lab.embodied_cli --db "$RUNNER_TEMP/esoteric-library/handled-17-volume-backup.sqlite3" verify-custody
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])/"esoteric-library"
          shelf = json.loads((root/"after-pickup-shelf1.json").read_text())
          bench = json.loads((root/"after-drop-workbench.json").read_text())
          read = json.loads((root/"workbench-source-read.json").read_text())
          reused = json.loads((root/"reused-shelf1-with-beaker.json").read_text())
          op = json.loads((root/"reused-slot-operator-receipt.json").read_text())
          assert shelf["positions"][0]["occupant"] is None
          assert reused["positions"][0]["occupant"]["id"] == "beaker:001"
          assert op["domain"] == "effective_physical_placement"
          assert bench["positions"][0]["occupant"]["id"] == "book:008"
          assert len(read["page_text"]) > 100
          print("Actual full-text book moved off shelf, carried and reread at bench")
          PY
      - name: Upload verified 17-volume persistent laboratory snapshot
        uses: actions/upload-artifact@v4
        with:
          name: esoteric-17-volume-fulltext-laboratory
          path: "${{ runner.temp }}/esoteric-library/*"
          if-no-files-found: error
          retention-days: 60
