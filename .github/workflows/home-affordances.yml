name: Discoverable Living Home Affordances
on:
  push:
    branches:
      - experiment/lab-discoverable-home-affordances-20261018
  pull_request:
    paths:
      - pretorius_lab/home_affordances.py
      - tests/test_home_affordances.py
      - .github/workflows/home-affordances.yml
  workflow_dispatch:
jobs:
  truthful-open-ended-offers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - name: Truthful physically possible home activities
        run: python -m unittest discover -s tests -p test_home_affordances.py -v
      - name: Previous permanent world and paper tests
        run: python -m unittest discover -s tests -v
