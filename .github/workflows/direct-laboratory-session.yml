name: Direct model-free laboratory session
on:
  pull_request:
    paths:
      - "examples/direct_lab_session.py"
      - ".github/workflows/direct-laboratory-session.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  direct-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing standard-library laboratory
        run: python -m pip install -e .
      - name: Directly interact with an independent saved laboratory
        run: |
          python examples/direct_lab_session.py --output "$RUNNER_TEMP/direct-lab"
          cp "$RUNNER_TEMP/direct-lab/direct-session-report.json" direct-session-report.json
      - name: Run existing laboratory regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Save verified world and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-model-free-lab-world-and-report
          path: |
            direct-session-report.json
          if-no-files-found: warn
          retention-days: 30
