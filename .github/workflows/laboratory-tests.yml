name: Permanent laboratory acceptance tests
on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python modules
        run: python -m compileall -q pretorius_lab tests
      - name: Run laboratory replay and offline-conflict tests
        run: python -m unittest discover -s tests -v
      - name: Exercise opt-in domestic life and automatic spoken reflex
        run: |
          python -m pretorius_lab.habitat_v2 --db "$RUNNER_TEMP/domestic-pilot.sqlite3" init
          python -m pretorius_lab.home_cli --db "$RUNNER_TEMP/domestic-pilot.sqlite3" init
          python -m pretorius_lab.home_cli --db "$RUNNER_TEMP/domestic-pilot.sqlite3" look
          python -m pretorius_lab.home_cli --db "$RUNNER_TEMP/domestic-pilot.sqlite3" walk station:hall
          python -m pretorius_lab.home_cli --db "$RUNNER_TEMP/domestic-pilot.sqlite3" walk station:shop:private
          python -m pretorius_lab.home_cli --db "$RUNNER_TEMP/domestic-pilot.sqlite3" verify
          python -m pretorius_lab.home_cli --db "$RUNNER_TEMP/domestic-pilot.sqlite3" shop-manifest
      - name: Exercise resource-bounded domestic daily life and evidence replay
        run: |
          python -m pretorius_lab.habitat_v2 --db "$RUNNER_TEMP/rhythm-pilot.sqlite3" init
          python -m pretorius_lab.home_cli --db "$RUNNER_TEMP/rhythm-pilot.sqlite3" init
          python -m pretorius_lab.daily_cli --db "$RUNNER_TEMP/rhythm-pilot.sqlite3" init
          python -m pretorius_lab.home_cli --db "$RUNNER_TEMP/rhythm-pilot.sqlite3" walk station:hall
          python -m pretorius_lab.home_cli --db "$RUNNER_TEMP/rhythm-pilot.sqlite3" walk station:kitchen
          python -m pretorius_lab.daily_cli --db "$RUNNER_TEMP/rhythm-pilot.sqlite3" prepare_meal
          python -m pretorius_lab.daily_cli --db "$RUNNER_TEMP/rhythm-pilot.sqlite3" eat
          python -m pretorius_lab.daily_cli --db "$RUNNER_TEMP/rhythm-pilot.sqlite3" advance 120
          python -m pretorius_lab.daily_cli --db "$RUNNER_TEMP/rhythm-pilot.sqlite3" look
          python -m pretorius_lab.daily_cli --db "$RUNNER_TEMP/rhythm-pilot.sqlite3" verify
      - name: Exercise first-person unified subject port and physical resource gates
        run: |
          python -m pretorius_lab.habitat_v2 --db "$RUNNER_TEMP/subject-pilot.sqlite3" init
          python -m pretorius_lab.home_cli --db "$RUNNER_TEMP/subject-pilot.sqlite3" init
          python -m pretorius_lab.daily_cli --db "$RUNNER_TEMP/subject-pilot.sqlite3" init
          python -m pretorius_lab.subject_cli --db "$RUNNER_TEMP/subject-pilot.sqlite3" look
          python -m pretorius_lab.subject_cli --db "$RUNNER_TEMP/subject-pilot.sqlite3" walk station:hall
          python -m pretorius_lab.subject_cli --db "$RUNNER_TEMP/subject-pilot.sqlite3" walk station:shop:private
          python -m pretorius_lab.subject_cli --db "$RUNNER_TEMP/subject-pilot.sqlite3" light
          python -m pretorius_lab.subject_cli --db "$RUNNER_TEMP/subject-pilot.sqlite3" look
      - name: Exercise persistent CLI restart and verification
        run: |
          python -m pretorius_lab --db "$RUNNER_TEMP/lab.sqlite3" init
          python -m pretorius_lab --db "$RUNNER_TEMP/lab.sqlite3" observe
          python -m pretorius_lab --db "$RUNNER_TEMP/lab.sqlite3" act open container:specimen
          python -m pretorius_lab --db "$RUNNER_TEMP/lab.sqlite3" checkpoint
          python -m pretorius_lab --db "$RUNNER_TEMP/lab.sqlite3" verify
          python -m pretorius_lab --db "$RUNNER_TEMP/lab.sqlite3" backup "$RUNNER_TEMP/backup.sqlite3"
          python -m pretorius_lab --db "$RUNNER_TEMP/lab.sqlite3" restore "$RUNNER_TEMP/backup.sqlite3" "$RUNNER_TEMP/recovered.sqlite3"

      - name: Exercise exact spatial continuity across CLI sessions
        run: |
          python -m pretorius_lab.habitat_v2 --db "$RUNNER_TEMP/home.sqlite3" init
          python -m pretorius_lab.habitat_v2 --db "$RUNNER_TEMP/home.sqlite3" locate book:007
          python -m pretorius_lab.habitat_v2 --db "$RUNNER_TEMP/home.sqlite3" scan shelf:3
          python -m pretorius_lab.habitat_v2 --db "$RUNNER_TEMP/home.sqlite3" act break beaker:001
          python -m pretorius_lab.habitat_v2 --db "$RUNNER_TEMP/home.sqlite3" act collect beaker:001
          python -m pretorius_lab.habitat_v2 --db "$RUNNER_TEMP/home.sqlite3" act place beaker:001 floor:corner:nw
          python -m pretorius_lab.habitat_v2 --db "$RUNNER_TEMP/home.sqlite3" checkpoint
          python -m pretorius_lab.habitat_v2 --db "$RUNNER_TEMP/home.sqlite3" verify
          python -m pretorius_lab.habitat_v2 --db "$RUNNER_TEMP/home.sqlite3" fork "$RUNNER_TEMP/fork.sqlite3"
          python -m pretorius_lab.habitat_v2 --db "$RUNNER_TEMP/home.sqlite3" backup "$RUNNER_TEMP/home-backup.sqlite3"
          python -m pretorius_lab.habitat_v2 --db "$RUNNER_TEMP/home-backup.sqlite3" verify

      - name: Exercise source-backed book reading and persistent bookmark
        run: |
          python -m pretorius_lab.habitat_v2 --db "$RUNNER_TEMP/books-home.sqlite3" init
          python -m pretorius_lab.book_cli --db "$RUNNER_TEMP/books-home.sqlite3" init
          python -m pretorius_lab.book_cli --db "$RUNNER_TEMP/books-home.sqlite3" install book:007 fixtures/DEMO_BOOK_007.json
          python -m pretorius_lab.book_cli --db "$RUNNER_TEMP/books-home.sqlite3" open book:007
          python -m pretorius_lab.book_cli --db "$RUNNER_TEMP/books-home.sqlite3" read book:007
          python -m pretorius_lab.book_cli --db "$RUNNER_TEMP/books-home.sqlite3" turn book:007 1
          python -m pretorius_lab.book_cli --db "$RUNNER_TEMP/books-home.sqlite3" mark book:007 blue-ribbon
          python -m pretorius_lab.book_cli --db "$RUNNER_TEMP/books-home.sqlite3" close book:007
          python -m pretorius_lab.book_cli --db "$RUNNER_TEMP/books-home.sqlite3" open_mark book:007 blue-ribbon
          python -m pretorius_lab.book_cli --db "$RUNNER_TEMP/books-home.sqlite3" read book:007
          python -m pretorius_lab.book_cli --db "$RUNNER_TEMP/books-home.sqlite3" verify
          python -m pretorius_lab.habitat_v2 --db "$RUNNER_TEMP/books-home.sqlite3" backup "$RUNNER_TEMP/books-backup.sqlite3"
          python -m pretorius_lab.book_cli --db "$RUNNER_TEMP/books-backup.sqlite3" verify
          python -m pretorius_lab.habitat_v2 --db "$RUNNER_TEMP/books-home.sqlite3" fork "$RUNNER_TEMP/books-fork.sqlite3"
          python -m pretorius_lab.book_cli --db "$RUNNER_TEMP/books-fork.sqlite3" verify

      - name: Exercise persisted subject-facing observations without geometry disclosure
        run: |
          python -m pretorius_lab.observation_receipts --db "$RUNNER_TEMP/books-home.sqlite3" init
          python -m pretorius_lab.observation_receipts --db "$RUNNER_TEMP/books-home.sqlite3" room room:sanctum
          python -m pretorius_lab.observation_receipts --db "$RUNNER_TEMP/books-home.sqlite3" shelf shelf:3
          python -m pretorius_lab.observation_receipts --db "$RUNNER_TEMP/books-home.sqlite3" object book:007
          python -m pretorius_lab.observation_receipts --db "$RUNNER_TEMP/books-home.sqlite3" verify
          python -m pretorius_lab.habitat_v2 --db "$RUNNER_TEMP/books-home.sqlite3" backup "$RUNNER_TEMP/full-backup.sqlite3"
          python -m pretorius_lab.observation_receipts --db "$RUNNER_TEMP/full-backup.sqlite3" verify
          python -m pretorius_lab.habitat_v2 --db "$RUNNER_TEMP/books-home.sqlite3" fork "$RUNNER_TEMP/fork-after-view.sqlite3"
          python -m pretorius_lab.observation_receipts --db "$RUNNER_TEMP/fork-after-view.sqlite3" verify

      - name: Exercise embodied position-gated reading and persistent actor receipts
        run: |
          python -m pretorius_lab.habitat_v2 --db "$RUNNER_TEMP/subject-home.sqlite3" init
          python -m pretorius_lab.book_cli --db "$RUNNER_TEMP/subject-home.sqlite3" init
          python -m pretorius_lab.book_cli --db "$RUNNER_TEMP/subject-home.sqlite3" install book:007 fixtures/DEMO_BOOK_007.json
          python -m pretorius_lab.embodied_cli --db "$RUNNER_TEMP/subject-home.sqlite3" init
          python -m pretorius_lab.embodied_cli --db "$RUNNER_TEMP/subject-home.sqlite3" look
          if python -m pretorius_lab.embodied_cli --db "$RUNNER_TEMP/subject-home.sqlite3" book open book:007; then
            echo "ERROR: doorway reading unexpectedly succeeded"; exit 1
          fi
          python -m pretorius_lab.embodied_cli --db "$RUNNER_TEMP/subject-home.sqlite3" go station:center
          python -m pretorius_lab.embodied_cli --db "$RUNNER_TEMP/subject-home.sqlite3" go station:shelf:3
          python -m pretorius_lab.embodied_cli --db "$RUNNER_TEMP/subject-home.sqlite3" look
          python -m pretorius_lab.embodied_cli --db "$RUNNER_TEMP/subject-home.sqlite3" book open book:007
          python -m pretorius_lab.embodied_cli --db "$RUNNER_TEMP/subject-home.sqlite3" book read book:007
          python -m pretorius_lab.embodied_cli --db "$RUNNER_TEMP/subject-home.sqlite3" book turn book:007 --direction 1
          python -m pretorius_lab.embodied_cli --db "$RUNNER_TEMP/subject-home.sqlite3" book mark book:007 --bookmark crimson-slip
          python -m pretorius_lab.embodied_cli --db "$RUNNER_TEMP/subject-home.sqlite3" book close book:007
          python -m pretorius_lab.embodied_cli --db "$RUNNER_TEMP/subject-home.sqlite3" book open_mark book:007 --bookmark crimson-slip
          python -m pretorius_lab.embodied_cli --db "$RUNNER_TEMP/subject-home.sqlite3" book read book:007
          python -m pretorius_lab.embodied_cli --db "$RUNNER_TEMP/subject-home.sqlite3" verify
          python -m pretorius_lab.habitat_v2 --db "$RUNNER_TEMP/subject-home.sqlite3" backup "$RUNNER_TEMP/subject-backup.sqlite3"
          python -m pretorius_lab.embodied_cli --db "$RUNNER_TEMP/subject-backup.sqlite3" verify
          python -m pretorius_lab.habitat_v2 --db "$RUNNER_TEMP/subject-home.sqlite3" fork "$RUNNER_TEMP/subject-fork.sqlite3"
          python -m pretorius_lab.embodied_cli --db "$RUNNER_TEMP/subject-fork.sqlite3" verify
