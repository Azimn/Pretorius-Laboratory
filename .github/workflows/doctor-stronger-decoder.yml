name: Pretorius stronger pinned local decoder experiment
on:
  pull_request:
    paths:
      - "pretorius_lab/doctor_stronger_local_decoder.py"
      - "pretorius_lab/doctor_recall_policy_research.py"
      - "pretorius_lab/doctor_subject_query_research.py"
      - "tests/test_doctor_subject_query_research.py"
      - "docs/DOCTOR_SUBJECT_OWNED_QUERY_GATE6_2026-10-12.md"
      - "tests/test_doctor_stronger_decoder.py"
      - "tools/run_doctor_mediated_recall_pilot.py"
      - ".github/workflows/doctor-stronger-decoder.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stronger-local-decoder:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          path: laboratory
      - uses: actions/checkout@v4
        with:
          repository: Azimn/The-Doctor-Lives
          ref: 56aab5493ef48cdb560881a138b2277ca6ebcce0
          persist-credentials: false
          path: doctor-cognition
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify stable brain and lab revisions
        run: |
          test "$(git -C doctor-cognition rev-parse HEAD)" = "56aab5493ef48cdb560881a138b2277ca6ebcce0"
          git -C laboratory rev-parse HEAD > laboratory-head.txt
          git -C doctor-cognition rev-parse HEAD > doctor-head.txt
      - name: Install free frozen local inference and existing research modules
        run: |
          python -m pip install -e ./doctor-cognition -e ./laboratory
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.5.1+cpu"
          python -m pip install "transformers==4.46.3" "huggingface-hub==0.26.5" "tokenizers==0.20.3"
      - name: Test source-bound first-person, query and model-only contracts
        working-directory: laboratory
        run: |
          python -m unittest discover -s tests -p "test_doctor_stronger_decoder.py" -v
          python -m unittest discover -s tests -p "test_doctor_subject_query_research.py" -v
          python -m unittest discover -s tests -p "test_doctor_recall_policy_research.py" -v
          python -m unittest discover -s tests -p "test_doctor_subject_frame_proposer.py" -v
      - name: Execute pinned Qwen 1.5B CPU decoder across 32 labeled research trials
        working-directory: laboratory
        run: |
          python tools/run_doctor_mediated_recall_pilot.py --model qwen25_1p5b --output "$RUNNER_TEMP/stronger-decoder-recall"
          cp "$RUNNER_TEMP/stronger-decoder-recall/score.json" ../qwen25-recall-score.json
          cp "$RUNNER_TEMP/stronger-decoder-recall/decoder-provenance.json" ../qwen25-model-provenance.json
          cat ../qwen25-recall-score.json
      - name: Preserve precise revision, scored negative outcomes and control
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pretorius-qwen25-1p5b-recall-conditional-actions
          path: |
            qwen25-recall-score.json
            qwen25-model-provenance.json
            laboratory-head.txt
            doctor-head.txt
          if-no-files-found: warn
          retention-days: 60
